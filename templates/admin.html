<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — EduBot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; }
        .topbar a { color: #38bdf8; text-decoration: none; font-size: 0.95rem; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { margin-bottom: 14px; color: #38bdf8; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin: 10px 0 4px; }
        input, select, textarea {
            width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff;
            padding: 10px 12px; border-radius: 8px; font-size: 0.95rem;
        }
        button {
            margin-top: 14px; background: #2563eb; color: #fff; border: none;
            padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .status { margin-top: 10px; font-size: 0.88rem; color: #4ade80; }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h2>⚙️ Адмін-панель освітнього чат-бота</h2>
        <a href="/">← Повернутися до чату</a>
    </div>

    <!-- 1. Створення сповіщення -->
    <div class="card">
        <h3>📢 Надіслати оголошення студентам</h3>
        <form id="notifForm">
            <label>Категорія</label>
            <select id="notifCategory">
                <option value="schedule_changes">Зміни в розкладі</option>
                <option value="deadlines">Дедлайни</option>
                <option value="general">Загальне оголошення</option>
            </select>
            <label>Цільова група (залиште порожнім для всіх)</label>
            <input type="text" id="notifGroup" placeholder="Наприклад: ІПЗ-31">
            <label>Текст повідомлення</label>
            <textarea id="notifText" rows="3" required placeholder="Введіть текст оголошення..."></textarea>
            <button type="submit">Опублікувати сповіщення</button>
            <div class="status" id="notifStatus"></div>
        </form>
    </div>

    <!-- 2. База знань RAG -->
    <div class="card">
        <h3>📚 Завантаження документів у базу знань (RAG)</h3>
        <form id="kbForm">
            <label>Файл документа (.pdf або .txt)</label>
            <input type="file" id="kbFile" accept=".pdf,.txt" required>
            <label>Офіційне посилання на джерело (опціонально)</label>
            <input type="url" id="kbUrl" placeholder="https://university.edu.ua/docs/rules.pdf">
            <button type="submit">Завантажити та проіндексувати</button>
            <div class="status" id="kbStatus"></div>
        </form>
    </div>

    <!-- 3. Налаштування API розкладу -->
    <div class="card">
        <h3>📅 Налаштування джерела розкладу</h3>
        <form id="schedForm">
            <label>URL API розкладу</label>
            <input type="url" id="schedUrl" value="https://api.university.edu.ua/v1/schedule" required>
            <label>Час кешування (хвилин)</label>
            <input type="number" id="schedTimeout" value="30" min="1" required>
            <button type="submit">Оновити конфігурацію та очистити кеш</button>
            <div class="status" id="schedStatus"></div>
        </form>
    </div>
</div>

<script>
    document.getElementById('notifForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/admin/notifications', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: document.getElementById('notifCategory').value,
                target_group: document.getElementById('notifGroup').value.trim() || null,
                message_text: document.getElementById('notifText').value.trim()
            })
        });
        const data = await res.json();
        document.getElementById('notifStatus').textContent = res.ok ? `✅ Сповіщення #${data.notification_id} збережено!` : `❌ Помилка: ${data.detail}`;
    });

    document.getElementById('kbForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('file', document.getElementById('kbFile').files[0]);
        const url = document.getElementById('kbUrl').value.trim();
        if (url) formData.append('source_url', url);

        const res = await fetch('/api/admin/knowledge-base', { method: 'POST', body: formData });
        const data = await res.json();
        document.getElementById('kbStatus').textContent = res.ok ? `✅ Проіндексовано чанків: ${data.chunks_saved}` : `❌ Помилка: ${data.detail}`;
    });

    document.getElementById('schedForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/admin/schedule-config', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                api_endpoint: document.getElementById('schedUrl').value.trim(),
                cache_timeout: parseInt(document.getElementById('schedTimeout').value, 10)
            })
        });
        document.getElementById('schedStatus').textContent = res.ok ? '✅ Конфігурацію оновлено, кеш очищено!' : '❌ Помилка оновлення';
    });
</script>
</body>
</html>
