<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — EduBot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; }
        .topbar a { color: #38bdf8; text-decoration: none; font-size: 0.95rem; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card h3 { margin-bottom: 14px; color: #38bdf8; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin: 10px 0 4px; }
        input, select, textarea {
            width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff;
            padding: 10px 12px; border-radius: 8px; font-size: 0.95rem;
        }
        .dropzone {
            border: 2px dashed #475569; border-radius: 10px; padding: 24px; text-align: center;
            background: #0f172a; cursor: pointer; transition: border-color 0.2s, background 0.2s;
            margin-top: 6px;
        }
        .dropzone.dragover { border-color: #38bdf8; background: #172554; }
        .dropzone p { color: #cbd5e1; font-size: 0.95rem; }
        .dropzone span { display: block; color: #64748b; font-size: 0.82rem; margin-top: 4px; }
        .file-chosen { margin-top: 8px; color: #38bdf8; font-weight: 600; font-size: 0.9rem; }

        button {
            margin-top: 14px; background: #2563eb; color: #fff; border: none;
            padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger {
            margin-top: 0; background: #dc2626; padding: 6px 12px; font-size: 0.82rem;
        }
        .btn-danger:hover { background: #b91c1c; }

        .status { margin-top: 10px; font-size: 0.88rem; }
        .status.ok { color: #4ade80; }
        .status.err { color: #f87171; }

        .doc-list { margin-top: 18px; border-top: 1px solid #334155; padding-top: 14px; }
        .doc-list h4 { font-size: 0.92rem; color: #94a3b8; margin-bottom: 10px; }
        .doc-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; border: 1px solid #334155; border-radius: 8px;
            padding: 10px 14px; margin-bottom: 8px;
        }
        .doc-meta { font-size: 0.85rem; color: #94a3b8; }
        .doc-meta a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h2>⚙️ Адмін-панель освітнього чат-бота</h2>
        <a href="/">← Повернутися до чату</a>
    </div>

    <!-- 1. Створення сповіщення -->
    <div class="card">
        <h3>📢 Надіслати оголошення студентам</h3>
        <form id="notifForm">
            <label>Категорія</label>
            <select id="notifCategory">
                <option value="schedule_changes">Зміни в розкладі</option>
                <option value="deadlines">Дедлайни</option>
                <option value="general">Загальне оголошення</option>
            </select>
            <label>Цільова група (залиште порожнім для всіх)</label>
            <input type="text" id="notifGroup" placeholder="Наприклад: ІПЗ-31">
            <label>Текст повідомлення</label>
            <textarea id="notifText" rows="3" required placeholder="Введіть текст оголошення..."></textarea>
            <button type="submit">Опублікувати сповіщення</button>
            <div class="status" id="notifStatus"></div>
        </form>
    </div>

    <!-- 2. База знань RAG -->
    <div class="card">
        <h3>📚 Завантаження документів у базу знань (RAG)</h3>
        <form id="kbForm">
            <label>Файл документа</label>
            <div class="dropzone" id="dropzone">
                <p>Перетягніть файл сюди або натисніть для вибору</p>
                <span>Підтримуються: .pdf, .docx, .txt, .md, .csv</span>
                <div class="file-chosen" id="fileChosen"></div>
            </div>
            <input type="file" id="kbFile" accept=".pdf,.docx,.txt,.md,.csv" style="display:none" required>

            <label>Офіційне посилання на джерело (опціонально)</label>
            <input type="url" id="kbUrl" placeholder="https://pnu.edu.ua/docs/rules.pdf">

            <button type="submit" id="kbSubmitBtn">Завантажити та проіндексувати</button>
            <div class="status" id="kbStatus"></div>
        </form>

        <div class="doc-list">
            <h4>Завантажені документи в базі знань:</h4>
            <div id="docsContainer"><span class="doc-meta">Завантаження списку...</span></div>
        </div>
    </div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('kbFile');
    const fileChosen = document.getElementById('fileChosen');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            fileChosen.textContent = `📄 Обрано: ${e.dataTransfer.files[0].name}`;
        }
    });
    fileInput.addEventListener('change', () => {
        fileChosen.textContent = fileInput.files.length ? `📄 Обрано: ${fileInput.files[0].name}` : '';
    });

    async function loadDocuments() {
        const container = document.getElementById('docsContainer');
        try {
            const res = await fetch('/api/admin/knowledge-base');
            const data = await res.json();
            if (!res.ok || !data.documents || !data.documents.length) {
                container.innerHTML = '<span class="doc-meta">База знань поки порожня.</span>';
                return;
            }
            container.innerHTML = data.documents.map(doc => `
                <div class="doc-item">
                    <div>
                        <strong>📄 ${doc.document_name}</strong>
                        <div class="doc-meta">
                            Чанків: ${doc.chunks_count}
                            ${doc.source_url ? ` • <a href="${doc.source_url}" target="_blank">Джерело</a>` : ''}
                        </div>
                    </div>
                    <button type="button" class="btn-danger" onclick="deleteDocument('${encodeURIComponent(doc.document_name)}')">Видалити</button>
                </div>
            `).join('');
        } catch {
            container.innerHTML = '<span class="doc-meta">Не вдалося завантажити список документів.</span>';
        }
    }

    async function deleteDocument(encodedName) {
        if (!confirm('Видалити цей документ із бази знань?')) return;
        const res = await fetch(`/api/admin/knowledge-base/${encodedName}`, { method: 'DELETE' });
        if (res.ok) loadDocuments();
    }

    document.getElementById('notifForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('notifStatus');
        const res = await fetch('/api/admin/notifications', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: document.getElementById('notifCategory').value,
                target_group: document.getElementById('notifGroup').value.trim() || null,
                message_text: document.getElementById('notifText').value.trim()
            })
        });
        const data = await res.json();
        statusEl.className = res.ok ? 'status ok' : 'status err';
        statusEl.textContent = res.ok ? `✅ Сповіщення #${data.notification_id} збережено!` : `❌ Помилка: ${data.detail}`;
    });

    document.getElementById('kbForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('kbStatus');
        const btn = document.getElementById('kbSubmitBtn');

        if (!fileInput.files.length) {
            statusEl.className = 'status err';
            statusEl.textContent = '❌ Спочатку оберіть файл.';
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const url = document.getElementById('kbUrl').value.trim();
        if (url) formData.append('source_url', url);

        btn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = '⏳ Завантаження та векторизація документа...';

        try {
            const res = await fetch('/api/admin/knowledge-base', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) {
                statusEl.className = 'status ok';
                statusEl.textContent = `✅ Файл «${data.filename}» проіндексовано (чанків: ${data.chunks_saved})`;
                fileInput.value = '';
                fileChosen.textContent = '';
                loadDocuments();
            } else {
                statusEl.className = 'status err';
                statusEl.textContent = `❌ Помилка: ${data.detail || 'Не вдалося обробити файл'}`;
            }
        } catch (err) {
            statusEl.className = 'status err';
            statusEl.textContent = `❌ Помилка мережі: ${err.message}`;
        } finally {
            btn.disabled = false;
        }
    });

    loadDocuments();
</script>
</body>
</html>
