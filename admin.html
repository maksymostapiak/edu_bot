<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | Освітній Viber-бот</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">


    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="bg-purple-600 text-white font-bold px-3 py-1 rounded-lg">Viber EduBot</span>
            <h1 class="text-lg font-semibold">Панель адміністратора</h1>
        </div>
        <span class="text-sm text-slate-400">Статус API: <span class="text-emerald-400">● Онлайн</span></span>
    </nav>

    <main class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">


        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 md:col-span-2">
            <h2 class="text-xl font-semibold mb-4 text-purple-400">1. Створити подію / Push-сповіщення</h2>
            <form id="eventForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Курс</label>
                    <select id="course" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5">
                        <option value="all">Усі курси</option>
                        <option value="1">1 курс</option>
                        <option value="2">2 курс</option>
                        <option value="3">3 курс</option>
                        <option value="4">4 курс</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Група (необов'язково)</label>
                    <input type="text" id="targetGroup" placeholder="Напр. ІПЗ-31"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Категорія</label>
                    <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5">
                        <option value="schedule_changes">Зміни в розкладі</option>
                        <option value="deadlines">Дедлайни / Іспити</option>
                        <option value="payments">Оплата за навчання</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-sm text-slate-400 mb-1">Текст сповіщення</label>
                    <textarea id="messageText" rows="3" required placeholder="Введіть текст події..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5"></textarea>
                </div>
                <div class="md:col-span-3 flex justify-end">
                    <button type="submit" class="bg-purple-600 hover:bg-purple-500 px-6 py-2.5 rounded-lg font-medium transition">
                        Надіслати сповіщення
                    </button>
                </div>
            </form>
        </section>


        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-sky-400">2. Джерело розкладу (API)</h2>
            <form id="scheduleSourceForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">URL зовнішнього API університету</label>
                    <input type="url" id="apiEndpoint" required
                           value="https://api.university.edu.ua/v1/schedule"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Час життя кешу (хвилини)</label>
                    <input type="number" id="cacheTimeout" value="30" min="1"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5">
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 py-2.5 rounded-lg font-medium transition">
                    Зберегти налаштування
                </button>
            </form>
        </section>


        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-emerald-400">3. База знань ШІ (RAG)</h2>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Посилання на офіційний ресурс</label>
                    <input type="url" id="sourceUrl" placeholder="https://university.edu.ua/docs/..."
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Файл документа (PDF / TXT)</label>
                    <input type="file" id="docFile" accept=".pdf,.txt" required
                           class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-700 file:text-white hover:file:bg-slate-600">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg font-medium transition">
                    Завантажити та векторизувати
                </button>
            </form>
        </section>

    </main>


    <div id="toast" class="fixed bottom-5 right-5 hidden bg-emerald-600 text-white px-5 py-3 rounded-lg shadow-lg"></div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }


        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                course: document.getElementById('course').value,
                target_group: document.getElementById('targetGroup').value || null,
                category: document.getElementById('category').value,
                message_text: document.getElementById('messageText').value
            };
            console.log('POST /api/admin/notifications', payload);
            // await fetch('/api/admin/notifications', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            showToast('Сповіщення додано в чергу розсилки!');
            e.target.reset();
        });


        document.getElementById('scheduleSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                api_endpoint: document.getElementById('apiEndpoint').value,
                cache_timeout: Number(document.getElementById('cacheTimeout').value)
            };
            console.log('PUT /api/admin/schedule-config', payload);
            showToast('Джерело розкладу оновлено!');
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('source_url', document.getElementById('sourceUrl').value);
            formData.append('file', document.getElementById('docFile').files[0]);
            console.log('POST /api/admin/knowledge-base', formData);
            showToast('Документ відправлено на векторизацію!');
            e.target.reset();
        });
    </script>
</body>
</html>
